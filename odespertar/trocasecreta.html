<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Troca usando variável temporária
    let a = 5;
    let b = 10;

    console.log(`Antes: a = ${a}, b = ${b}`);

    let temp = a; 
    a = b;        
    b = temp;     

    console.log(`Depois: a = ${a}, b = ${b}`);

    </script>
</body>
</html>
