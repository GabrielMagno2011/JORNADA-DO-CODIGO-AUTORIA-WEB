<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de personagem</title>
</head>

<body>
    <script>
        let nome = prompt('Digite seu nome:');
        let idade = Number(prompt('Digite sua idade:'));

        alert(nome + ' ' + ' ' + idade + ' ' + classe + ' ' + vivo);
    </script>
</body>

</html>
